name: Proceso de datos

# 3.1: pruebas de los lectores y lectura de las fuentes oficiales reales.
# La tarea programada (3.6) se añadirá aquí cuando el proceso esté completo.
on:
  push:
    branches: [main]
    paths:
      - "datos/**"
      - ".github/workflows/datos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas de los lectores
        run: python3 -I -m unittest discover -s datos/tests -t . -v

  leer-fuentes:
    # Descarga la DGT y Trafikoa de sus URL oficiales. Si una falla o da cifras raras,
    # el programa sale con error y no escribe nada (ver datos/pipeline/leer_fuentes.py).
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar si Trafikoa responde desde Actions
        # Desde GitHub su servidor no contestaba el 15/11/2026 (se cuelga al conectar).
        # Si algún día responde, la lectura directa vuelve a funcionar sin cambiar nada.
        continue-on-error: true
        run: |
          r=$(curl -4 -sS -m 20 -o /dev/null -w "http=%{http_code} t=%{time_total}s" "https://apps.trafikoa.euskadi.eus/lfr/web/trafikoa/cabinas-de-radar-fijo" 2>&1 | tr '\n' ' ')
          echo "::notice title=Trafikoa desde Actions::$r"
      - name: Leer las fuentes reales
        run: |
          # El motivo del fallo se publica como anotación para poder leerlo sin bajar los registros.
          if ! python3 -I datos/pipeline/leer_fuentes.py --salida salida-prueba/radares_crudos.json 2> error.txt; then
            echo "::error title=Lectura de fuentes::$(tr '\n' ' ' < error.txt | cut -c1-900)"
            exit 1
          fi
          python3 -c "import json,collections as C;d=json.load(open('salida-prueba/radares_crudos.json'));c=C.Counter((r['fuente'],r['tipo']) for r in d['radares']);s=C.Counter(r['sentido_oficial'] for r in d['radares'] if r['fuente']=='dgt');print('::notice title=Recuentos::'+str(dict(c))+' DGT sentido: '+str(dict(s))+' DGT publicada: '+str(d['fuentes']['dgt']['publicado']))"
          python3 -c "import json;[print('::warning title=Fuente con aviso::'+a[:900]) for a in json.load(open('salida-prueba/radares_crudos.json'))['avisos']]"
      - name: Guardar el resultado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: radares-crudos
          path: salida-prueba/radares_crudos.json
          retention-days: 14
