name: Proceso de datos

# 3.1: pruebas de los lectores y lectura de las fuentes oficiales reales.
# 3.5: el trabajo "sentido" termina publicando datos/salida/radares.json y estado.json.
# 3.6: ejecución semanal (lunes). Cada ejecución cambia `generado` en datos/salida/estado.json y se
# confirma en el repositorio, así que GitHub no desactiva la tarea por falta de actividad (60 días).
on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - "datos/**"
      - ".github/workflows/datos.yml"
      # Las exploraciones puntuales no cambian los datos publicados.
      - "!datos/exploracion/**"
      - "!datos/pipeline/explorar_*.py"
  workflow_dispatch:

permissions:
  contents: read

# Una ejecución cada vez (20/11): dos a la vez chocaban al guardar la caché y la segunda fallaba (19/11 y 20/11).
# La nueva espera a que termine la que está en marcha.
concurrency:
  group: proceso-de-datos
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas de los lectores
        run: python3 -I -m unittest discover -s datos/tests -t . -v

  leer-fuentes:
    # Descarga la DGT y Trafikoa de sus URL oficiales. Si una falla o da cifras raras,
    # el programa sale con error y no escribe nada (ver datos/pipeline/leer_fuentes.py).
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar si Trafikoa responde desde Actions
        # Desde GitHub su servidor no contestaba el 15/11/2026 (se cuelga al conectar).
        # Si algún día responde, la lectura directa vuelve a funcionar sin cambiar nada.
        continue-on-error: true
        run: |
          r=$(curl -4 -sS -m 20 -o /dev/null -w "http=%{http_code} t=%{time_total}s" "https://apps.trafikoa.euskadi.eus/lfr/web/trafikoa/cabinas-de-radar-fijo" 2>&1 | tr '\n' ' ')
          echo "::notice title=Trafikoa desde Actions::$r"
      - name: Leer las fuentes reales
        run: |
          # El motivo del fallo se publica como anotación para poder leerlo sin bajar los registros.
          if ! python3 -I datos/pipeline/leer_fuentes.py --salida salida-prueba/radares_crudos.json 2> error.txt; then
            echo "::error title=Lectura de fuentes::$(tr '\n' ' ' < error.txt | cut -c1-900)"
            exit 1
          fi
          python3 -c "import json,collections as C;d=json.load(open('salida-prueba/radares_crudos.json'));c=C.Counter((r['fuente'],r['tipo']) for r in d['radares']);s=C.Counter(r['sentido_oficial'] for r in d['radares'] if r['fuente']=='dgt');print('::notice title=Recuentos::'+str(dict(c))+' DGT sentido: '+str(dict(s))+' DGT publicada: '+str(d['fuentes']['dgt']['publicado']))"
          python3 -c "import json;[print('::warning title=Fuente con aviso::'+a[:900]) for a in json.load(open('salida-prueba/radares_crudos.json'))['avisos']]"
      - name: Guardar el resultado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: radares-crudos
          path: salida-prueba/radares_crudos.json
          retention-days: 14
      - name: Guardar las copias buenas de las fuentes
        # Se renuevan solo si la lectura salió bien; las confirma el trabajo siguiente.
        uses: actions/upload-artifact@v4
        with:
          name: fuentes-copia
          path: datos/fuentes
          retention-days: 14

  sentido:
    # 3.2: calcula el sentido de los radares con OpenStreetMap, OSRM y Nominatim (que desde
    # Actions sí responden) y guarda las respuestas en datos/cache/ para no repetirlas.
    needs: leer-fuentes
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: radares-crudos
          path: salida-prueba
      - uses: actions/download-artifact@v4
        with:
          name: fuentes-copia
          path: datos/fuentes
      - name: Calcular el sentido (todos los radares)
        # Se corta a las 5 h 20 min con SIGINT: la caché se guarda y la siguiente ejecución sigue donde quedó.
        run: |
          timeout -s INT 320m python3 -I datos/pipeline/calcular_sentido.py --radares salida-prueba/radares_crudos.json --fuente todos || echo "::warning title=Sentido::cortado o con error (código $?); se guarda la caché y se continúa en la siguiente ejecución"
      - name: Caché de OpenStreetMap para la aproximación
        # La respuesta cruda pesa unos 28 KB por radar: no se versiona, se guarda en la caché de Actions.
        uses: actions/cache@v4
        with:
          path: datos/cache/osm_aprox.json
          key: osm-aprox-v2-${{ github.run_id }}
          restore-keys: osm-aprox-v2-
      - name: Tramo de aproximación (3.3, todos los radares resueltos)
        # Un recuadro de 1,2 km por radar de OpenStreetMap (una petición por segundo; la respuesta cruda
        # queda en la caché de Actions, así que repetir el cálculo no vuelve a descargar). Se corta con SIGINT
        # a las 3 h 20 min por si acaso. Los 11 radares de la prueba 0.8 se anotan uno a uno.
        run: |
          timeout -s INT 200m python3 -I datos/pipeline/calcular_aproximacion.py --radares salida-prueba/radares_crudos.json || echo "::warning title=Aproximación::cortado o con error (código $?)"
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from datos.pipeline.calcular_aproximacion import IDS_PRUEBA
          a = json.load(open("datos/cache/aproximacion.json"))
          for i in IDS_PRUEBA[:10]:
              v = a.get(i)
              if v:
                  print(f"::notice title=Prueba {i[:40]}::{v['fiab']} largo={v.get('largo_m')} tunel={v.get('tunel_m')} cruces={v.get('cruces')} amb={v.get('ambiguos')} {'; '.join(v.get('motivos') or [])}")
          PY
      - name: Límite de cada radar (3.4)
        # Usa solo la caché de OpenStreetMap de 3.2; publica recuentos y discrepancias como anotaciones.
        run: |
          python3 -I datos/pipeline/calcular_limites.py --radares salida-prueba/radares_crudos.json || echo "::warning title=Límites::falló (código $?)"
      - name: Radares de tramo (fase 5)
        # Ruta de OSRM del inicio al fin por cada calzada candidata, aproximación al inicio y límite
        # muestreado cada kilómetro. Las rutas quedan en datos/cache/osrm_tramos.json (se versiona).
        run: |
          timeout -s INT 60m python3 -I datos/pipeline/calcular_tramos.py --radares salida-prueba/radares_crudos.json || echo "::warning title=Tramos::cortado o con error (código $?)"
      - name: Contraste con detector-radar.com
        continue-on-error: true
        run: |
          python3 -I datos/pipeline/contraste.py --radares salida-prueba/radares_crudos.json --salida salida-prueba/contraste.json
      - name: Publicar radares.json y estado.json (3.5)
        # Si las cifras salen raras no toca radares.json (queda la última versión buena) y estado.json lo dice.
        run: |
          args=""
          [ -f salida-prueba/contraste.json ] && args="--contraste salida-prueba/contraste.json"
          python3 -I datos/pipeline/publicar.py --radares salida-prueba/radares_crudos.json $args 2> error-publicar.txt || {
            echo "::error title=Publicación::$(tr '\n' ' ' < error-publicar.txt | cut -c1-900)"; }
          python3 -c "import json;e=json.load(open('datos/salida/estado.json'));print('::notice title=Estado::ok='+str(e['ok'])+' publicados='+str(e['radares_publicados'])+' avisos='+str(e['avisos'])[:600])"
          ls -l datos/salida
      - name: Resumen del resultado
        if: always()
        run: |
          python3 - <<'PY'
          import json, collections as C
          crudos = {r["id"]: r for r in json.load(open("salida-prueba/radares_crudos.json"))["radares"]}
          res = json.load(open("datos/cache/sentido.json"))
          tot = C.Counter((crudos[i]["fuente"], v["resultado"], v.get("regla")) for i, v in res.items() if i in crudos)
          print("::notice title=Recuento por fuente y regla::" + str(dict(tot)))
          mot = C.Counter((crudos[i]["fuente"], v.get("motivo")) for i, v in res.items() if i in crudos and v["resultado"] == "ambos")
          print("::notice title=Motivos de ambos sentidos::" + str(dict(mot)))
          tr = [r for r in crudos.values() if r["fuente"] == "dgt" and r["tipo"] == "tramo"]
          c = C.Counter(("sin_pk" if r.get("pk_m") is None or r.get("pk_fin_m") is None else "fin>inicio" if r["pk_fin_m"] > r["pk_m"] else "fin<inicio" if r["pk_fin_m"] < r["pk_m"] else "igual") for r in tr)
          print("::notice title=Tramos DGT, kilometraje inicio-fin::" + str(dict(c)) + " sentido_oficial: " + str(dict(C.Counter(r.get("sentido_oficial") for r in tr))))
          ej = [f'{r["carretera"]} {r["pk_m"]}->{r["pk_fin_m"]} {r.get("sentido_oficial")}' for r in tr if r.get("pk_m") is not None and r.get("pk_fin_m") is not None][:12]
          print("::notice title=Ejemplos de tramos::" + " ; ".join(ej))
          PY
      - name: Guardar la caché en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/cache datos/salida datos/fuentes
          if git diff --cached --quiet; then echo "Sin cambios en la caché"; exit 0; fi
          git commit -m "Caché de servicios y sentido calculado (automático)"
          # Si entretanto cambió algo de lo generado, gana lo recién calculado (-X theirs en un rebase es este commit).
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
