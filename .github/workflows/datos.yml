name: Proceso de datos

# 3.1: pruebas de los lectores y lectura de las fuentes oficiales reales.
# La tarea programada (3.6) se añadirá aquí cuando el proceso esté completo.
on:
  push:
    branches: [main]
    paths:
      - "datos/**"
      - ".github/workflows/datos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas de los lectores
        run: python3 -I -m unittest discover -s datos/tests -t . -v

  leer-fuentes:
    # Descarga la DGT y Trafikoa de sus URL oficiales. Si una falla o da cifras raras,
    # el programa sale con error y no escribe nada (ver datos/pipeline/leer_fuentes.py).
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar si Trafikoa responde desde Actions
        # Desde GitHub su servidor no contestaba el 15/11/2026 (se cuelga al conectar).
        # Si algún día responde, la lectura directa vuelve a funcionar sin cambiar nada.
        continue-on-error: true
        run: |
          r=$(curl -4 -sS -m 20 -o /dev/null -w "http=%{http_code} t=%{time_total}s" "https://apps.trafikoa.euskadi.eus/lfr/web/trafikoa/cabinas-de-radar-fijo" 2>&1 | tr '\n' ' ')
          echo "::notice title=Trafikoa desde Actions::$r"
      - name: Leer las fuentes reales
        run: |
          # El motivo del fallo se publica como anotación para poder leerlo sin bajar los registros.
          if ! python3 -I datos/pipeline/leer_fuentes.py --salida salida-prueba/radares_crudos.json 2> error.txt; then
            echo "::error title=Lectura de fuentes::$(tr '\n' ' ' < error.txt | cut -c1-900)"
            exit 1
          fi
          python3 -c "import json,collections as C;d=json.load(open('salida-prueba/radares_crudos.json'));c=C.Counter((r['fuente'],r['tipo']) for r in d['radares']);s=C.Counter(r['sentido_oficial'] for r in d['radares'] if r['fuente']=='dgt');print('::notice title=Recuentos::'+str(dict(c))+' DGT sentido: '+str(dict(s))+' DGT publicada: '+str(d['fuentes']['dgt']['publicado']))"
          python3 -c "import json;[print('::warning title=Fuente con aviso::'+a[:900]) for a in json.load(open('salida-prueba/radares_crudos.json'))['avisos']]"
      - name: Guardar el resultado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: radares-crudos
          path: salida-prueba/radares_crudos.json
          retention-days: 14

  sentido:
    # 3.2: calcula el sentido de los radares con OpenStreetMap, OSRM y Nominatim (que desde
    # Actions sí responden) y guarda las respuestas en datos/cache/ para no repetirlas.
    needs: leer-fuentes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: radares-crudos
          path: salida-prueba
      - name: Calcular el sentido (radares de Trafikoa)
        run: python3 -I datos/pipeline/calcular_sentido.py --radares salida-prueba/radares_crudos.json --fuente trafikoa
      - name: Resumen por carretera y destino
        run: |
          python3 - <<'PY'
          import json, collections as C
          crudos = {r["id"]: r for r in json.load(open("salida-prueba/radares_crudos.json"))["radares"]}
          res = json.load(open("datos/cache/sentido.json"))
          g = C.defaultdict(C.Counter)
          for i, v in res.items():
              r = crudos[i]
              g[(r["carretera"], r["provincia"], r.get("destino") or "")][v.get("sentido_km") if v["resultado"] == "resuelto" else v["resultado"]] += 1
          lineas = [f"{k[0]}|{k[1]}|{k[2]}: {dict(c)}" for k, c in sorted(g.items())]
          for i in range(0, len(lineas), 12):
              print("::notice title=Sentido por grupo " + str(i // 12 + 1) + "::" + " ; ".join(lineas[i:i + 12])[:3800])
          for i, v in res.items():
              if v["resultado"] != "resuelto" and v["resultado"] != "no_aplica":
                  print("::warning title=Sin resolver::" + crudos[i]["nombre"][:60] + " -> " + v["resultado"] + ": " + str(v.get("motivo", ""))[:150])
          PY
      - name: Guardar la caché en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/cache
          if git diff --cached --quiet; then echo "Sin cambios en la caché"; exit 0; fi
          git commit -m "Caché de servicios y sentido calculado (automático)"
          git pull --rebase origin main
          git push origin HEAD:main

  servicios-3-2:
    # Diagnóstico temporal para 3.2: qué servicios externos del algoritmo del sentido
    # se alcanzan desde GitHub Actions. El resultado sale como anotaciones. No bloquea nada.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Probar servicios de rutas, geocodificación y mapa
        run: |
          prueba() {
            nombre="$1"; shift
            r=$(curl -4 -sS -m 25 -A "avisos-radares/0.1 (+https://github.com/unaitxo1986/avisos-radares)" -o /tmp/r.out -w "http=%{http_code} bytes=%{size_download} t=%{time_total}s" "$@" 2>&1 | tr '\n' ' ')
            muestra=$(head -c 90 /tmp/r.out 2>/dev/null | tr '\n"' '  ')
            echo "::notice title=$nombre::$r | $muestra"
          }
          prueba "OSRM demo (ruta)" "https://router.project-osrm.org/route/v1/driving/-3.0002,43.2864;-2.9350,43.2630?overview=false"
          prueba "Nominatim (geocodificar)" "https://nominatim.openstreetmap.org/search?q=Cantabria&format=json&limit=1"
          prueba "API de OpenStreetMap (mapa)" "https://api.openstreetmap.org/api/0.6/map.json?bbox=-3.0010,43.2858,-2.9990,43.2870"
          prueba "Overpass (estado)" "https://overpass-api.de/api/status"
          prueba "CartoCiudad (IGN)" "https://www.cartociudad.es/geocoder/api/geocoder/candidatesJsonp?q=A-2+km+202&limit=1&no_process=municipio"
          prueba "detector-radar.com" "https://detector-radar.com/wp-json/dgt/v1/capa/euskadi"
