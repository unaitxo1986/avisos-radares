name: Sonda CartoCiudad (temporal)
on:
  push:
    paths: [".github/workflows/sonda-cartociudad.yml"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Probar consultas
        run: |
          p() {
            r=$(curl -4 -sS -m 25 -A "avisos-radares/0.1" "$2" 2>&1 | head -c 700 | tr '\n' ' ')
            echo "::notice title=$1::$r"
          }
          p "candidates A-2 km 202" "https://www.cartociudad.es/geocoder/api/geocoder/candidatesJsonp?q=A-2+km+202&limit=3&no_process=municipio"
          p "find A-2 km 202" "https://www.cartociudad.es/geocoder/api/geocoder/findJsonp?q=A-2+km+202&type=portal"
          p "candidates A-8 km 120" "https://www.cartociudad.es/geocoder/api/geocoder/candidatesJsonp?q=A-8+km+120&limit=3"
          p "candidates carretera" "https://www.cartociudad.es/geocoder/api/geocoder/candidatesJsonp?q=A-2+PK+202&limit=3&type=portal,callejero"
