name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/compilar-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # para publicar el APK en la release "latest"

concurrency:
  group: compilar-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Las pruebas automáticas se ejecutan en cada compilación (regla del repositorio).
      # assembleDebug comprueba además que recursos y manifiesto empaquetan bien.
      - name: Pruebas y compilación de comprobación
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Comprobar secretos de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          faltan=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto $v (Settings > Secrets and variables > Actions)"
              faltan=1
            fi
          done
          exit $faltan

      - name: Restaurar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Quita espacios y saltos de línea que se cuelan al pegar el secreto.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' > "$RUNNER_TEMP/clave.b64"
          LONG=$(wc -c < "$RUNNER_TEMP/clave.b64")
          RAROS=$(tr -d 'A-Za-z0-9+/=' < "$RUNNER_TEMP/clave.b64" | wc -c)
          echo "::notice::KEYSTORE_BASE64: $LONG caracteres, $RAROS fuera del alfabeto base64"
          if ! base64 -d "$RUNNER_TEMP/clave.b64" > "$RUNNER_TEMP/release.jks"; then
            echo "::error::KEYSTORE_BASE64 no es base64 válido (¿pegado incompleto o con caracteres de más?)"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/clave.b64"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::La clave se decodifica pero no se abre: revisa KEYSTORE_PASSWORD y KEY_ALIAS, o el contenido de KEYSTORE_BASE64"
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verificar firma y mostrar huella del certificado
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/avisos-radares.apk"
          # Copia con la versión en el nombre (Unai, 19/11): versionName es 0.1.<número de compilación>.
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/avisos-radares-0.1.$GITHUB_RUN_NUMBER.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: avisos-radares-0.1.${{ github.run_number }}
          path: ${{ runner.temp }}/avisos-radares-0.1.${{ github.run_number }}.apk
          retention-days: 30

      # Enlace fijo y público (sin iniciar sesión) para bajar el APK desde el móvil:
      # https://github.com/unaitxo1986/avisos-radares/releases/download/latest/avisos-radares.apk
      # Desde el 19/11 la release lleva además el mismo APK con la versión en el nombre
      # (avisos-radares-0.1.<compilación>.apk), que es el que se ve en la página de la release.
      - name: Publicar en la release "latest"
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$RUNNER_TEMP/avisos-radares-0.1.$GITHUB_RUN_NUMBER.apk" "$RUNNER_TEMP/avisos-radares.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Versión 0.1.$GITHUB_RUN_NUMBER" \
            --notes "Versión 0.1.$GITHUB_RUN_NUMBER (compilación $GITHUB_RUN_NUMBER), commit $GITHUB_SHA. Firmada con la clave fija del proyecto. avisos-radares-0.1.$GITHUB_RUN_NUMBER.apk y avisos-radares.apk son el mismo fichero; el segundo es el del enlace fijo."
